apiVersion: apps/v1
kind: Deployment
metadata:
  name: iperf3
  namespace: basil-load
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iperf3
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: iperf3
    spec:
      containers:
      - args:
        - -s
        - -p
        - "5201"
        image: networkstatic/iperf3
        imagePullPolicy: Always
        name: iperf3
        resources:
          limits:
            memory: 128Mi
          requests:
            cpu: 100m
            memory: 64Mi
      dnsPolicy: ClusterFirst
      hostNetwork: true
      nodeSelector:
        kubernetes.io/hostname: mocha
      restartPolicy: Always
      securityContext: {}
      terminationGracePeriodSeconds: 30
