apiVersion: v1
kind: Service
metadata:
  name: basil
  namespace: basil-load
spec:
  selector:
    app: basil
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: irc
      port: 6667
      targetPort: 6667
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: basil
  namespace: basil-load
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: basil
  template:
    metadata:
      labels:
        app: basil
    spec:
      nodeSelector:
        kubernetes.io/hostname: mocha
      terminationGracePeriodSeconds: 90
      containers:
        - name: basil
          image: basil:load
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
            - containerPort: 6667
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: basil-load-secrets
                  key: postgres-password
            - name: ConnectionStrings__Write
              value: "Host=postgres;Port=5432;Database=basil;Username=basil;Password=$(POSTGRES_PASSWORD)"
            - name: ConnectionStrings__Read
              value: "Host=postgres;Port=5432;Database=basil;Username=basil;Password=$(POSTGRES_PASSWORD)"
            - name: Basil__Server__Domain
              value: basil.local
            # nginx runs with hostNetwork on mocha and reaches Basil over cni0 / LAN.
            - name: Basil__Server__TrustedProxies__0
              value: 10.42.0.0/16
            - name: Basil__Server__TrustedProxies__1
              value: 192.168.27.124/32
            - name: Basil__Server__Files__AccelPrefix
              value: /_files/
            - name: Serilog__MinimumLevel__Default
              value: Information
          resources:
            requests:
              cpu: "4"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 4Gi
          readinessProbe:
            exec:
              command: ["curl", "-sf", "-H", "Host: api.basil.local", "http://127.0.0.1:8080/health"]
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /app/Data
            - name: cache
              mountPath: /app/Cache
            - name: logs
              mountPath: /app/Logs
      volumes:
        - name: data
          hostPath:
            path: /home/haith/Desktop/osuBasil Data
            type: Directory
        - name: cache
          hostPath:
            path: /tmp/basil-load/Cache
            type: DirectoryOrCreate
        - name: logs
          hostPath:
            path: /tmp/basil-load/Logs
            type: DirectoryOrCreate
