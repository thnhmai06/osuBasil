name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --logger "console;verbosity=minimal"

      # Building the solution already regenerates the 5 OpenAPI documents (Microsoft.Extensions.ApiDescription.Server)
      # into src/Hosts/Host/obj/Basil.Host_{documentName}.json — upload them so deploy-docs doesn't need to rebuild.
      - name: Upload OpenAPI documents
        uses: actions/upload-artifact@v4
        with:
          name: openapi-documents
          path: src/Hosts/Host/obj/Basil.Host_*.json

  rest-contract:
    # Checks the HTTP contract of the REST API against a running server with the Postman collection in the repository
    # (status, envelope, public/token matrix, redirects, error statuses). It needs no Postman API key.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: basil
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      Basil__Database__ConnectionString: Host=127.0.0.1;Port=5432;Username=postgres;Password=pw;Database=basil
      Basil__Storage__DataDirectory: ${{ github.workspace }}/ci-data/Data
      Basil__Server__Domain: basil.local
      Basil__Server__Ports__Irc: "0"
      Basil__Bot__Replies__Path: ${{ github.workspace }}/ci-data/replies.json
      ASPNETCORE_URLS: http://127.0.0.1:5099

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6

      - name: Build the server
        run: dotnet build src/Hosts/Host --configuration Release

      - name: Create the administrator
        run: >-
          dotnet src/Hosts/Host/bin/Release/net10.0/Basil.Host.dll
          users create --username ciadmin --password ciadmin-pass --admin

      - name: Start the server
        run: |
          nohup dotnet src/Hosts/Host/bin/Release/net10.0/Basil.Host.dll > server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -H "Host: api.basil.local" http://127.0.0.1:5099/health && exit 0
            sleep 1
          done
          cat server.log
          exit 1

      - name: Install the Postman CLI
        run: curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh

      - name: Run the contract collection
        run: >-
          postman collection run tests/Hosts/Rest/postman/basil-rest.postman_collection.json
          -e tests/Hosts/Rest/postman/basil-local.postman_environment.json --ignore-redirects

      - name: Server log
        if: failure()
        run: cat server.log

  deploy-docs:
    needs: build-and-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7

      - name: Download OpenAPI documents
        uses: actions/download-artifact@v4
        with:
          name: openapi-documents
          path: openapi

      - name: Assemble static docs site
        run: |
          set -e
          SITE=site
          rm -rf "$SITE"
          mkdir -p "$SITE"
          # docs-site is served from /docs on a running instance, so nest it under docs/
          # and make the site root a redirect there.
          cp -r src/Hosts/Host/docs-site "$SITE/docs"
          cp openapi/Basil.Host_basilapi.json "$SITE/docs/basil-api/basilapi.json"
          cat > "$SITE/index.html" <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
          	<meta charset="utf-8">
          	<meta http-equiv="refresh" content="0; url=docs/">
          	<title>Basil Documentation</title>
          	<link rel="canonical" href="docs/">
          </head>
          <body/>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
