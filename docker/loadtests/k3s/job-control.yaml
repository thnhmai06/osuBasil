apiVersion: batch/v1
kind: Job
metadata:
  name: ${CONTROL_JOB_NAME}
  namespace: basil-load
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: control
        run: ${CONTROL_JOB_NAME}
    spec:
      nodeSelector:
        kubernetes.io/hostname: espresso
      hostNetwork: true
      restartPolicy: Never
      # Ubuntu's stacked containerd AppArmor profile denies signals and /proc access inside the pod.
      securityContext:
        appArmorProfile:
          type: Unconfined
      # Native sidecars: they run beside the control probe and stop with it, for network attribution.
      initContainers:
        - name: ping
          image: busybox:1.36.1
          restartPolicy: Always
          command: ["/bin/sh", "-c", "exec ping 192.168.27.124 > /reports/ping.log 2>&1"]
          volumeMounts:
            - name: reports
              mountPath: /reports
        - name: iperf3
          image: networkstatic/iperf3
          imagePullPolicy: IfNotPresent
          restartPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                date -u +"%Y-%m-%dT%H:%M:%SZ" >> /reports/iperf3.log
                iperf3 -c 192.168.27.124 -t 5 >> /reports/iperf3.log 2>&1 || true
                sleep 55
              done
          volumeMounts:
            - name: reports
              mountPath: /reports
      containers:
        - name: control
          image: mcr.microsoft.com/dotnet/runtime-deps:10.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              mkdir -p /reports
              /bin-host/Basil.Tests.LoadTests control \
                --connect 192.168.27.124 \
                --port 8443 \
                --irc-port 6697 \
                --domain basil.local \
                --accounts /data/accounts.csv \
                --world /data/world-data.json \
                --duration ${CONTROL_DURATION} \
                --reports /reports
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: bin
              mountPath: /bin-host
              readOnly: true
            - name: data
              mountPath: /data
              readOnly: true
            - name: reports
              mountPath: /reports
      volumes:
        - name: bin
          hostPath:
            path: /var/lib/basil-load/loadtests/bin
            type: Directory
        - name: data
          hostPath:
            path: /var/lib/basil-load/loadtests/data
            type: Directory
        - name: reports
          hostPath:
            path: /var/lib/basil-load/loadtests/reports/${RUN_ID}
            type: DirectoryOrCreate
