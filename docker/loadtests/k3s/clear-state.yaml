apiVersion: v1
kind: Pod
metadata:
  name: clear-state
  namespace: basil-load
spec:
  nodeSelector:
    kubernetes.io/hostname: mocha
  restartPolicy: Never
  securityContext:
    runAsUser: 0
  containers:
    - name: clear
      image: mcr.microsoft.com/dotnet/runtime-deps:10.0
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -eu
          # Empties the folders Basil writes so every run starts cold; fails when anything is left.
          for d in /data/Replays /data/Screenshots /data/Avatars /cache /logs; do
            [ -d "$d" ] || continue
            find "$d" -mindepth 1 -delete
            left="$(find "$d" -mindepth 1 | head -n 1)"
            if [ -n "$left" ]; then
              echo "not cleared: $left" >&2
              exit 1
            fi
          done
          : > /nginx-logs/load.log
      volumeMounts:
        - name: data
          mountPath: /data
        - name: cache
          mountPath: /cache
        - name: logs
          mountPath: /logs
        - name: nginx-logs
          mountPath: /nginx-logs
  volumes:
    - name: data
      hostPath:
        path: "${DATA_DIR}"
        type: Directory
    - name: cache
      hostPath:
        path: /tmp/basil-load/Cache
        type: DirectoryOrCreate
    - name: logs
      hostPath:
        path: /tmp/basil-load/Logs
        type: DirectoryOrCreate
    - name: nginx-logs
      hostPath:
        path: /tmp/basil-load/nginx-logs
        type: DirectoryOrCreate
