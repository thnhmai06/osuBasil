# nginx for the load test bench (W15). Same routing as docker/nginx/nginx.conf, with these differences:
# * it runs on mocha's host network on 8443 (HTTPS) and 6697 (IRC TLS), because traefik holds 80 and 443;
# * Basil is reached through its cluster Service;
# * one worker on its one pinned core;
# * the per-address limits are raised: every virtual user comes from the generator's one address, which stands in for
#   many real addresses (the software's own limits stay untouched);
# * a `load` access log carries the server-side time of every request, the source of the per-channel SLO.
worker_processes 1;
worker_rlimit_nofile 200000;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 60000;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # $upstream_response_time excludes the client's network; $request_time includes it. $token is "1" on a poll.
    map $http_osu_token $token {
        "" 0;
        default 1;
    }
    log_format load '$msec $host $request_method $uri $status $token $request_length $bytes_sent '
                    '$request_time $upstream_response_time';
    access_log /var/log/nginx/load/access.log load buffer=256k flush=5s;

    include /etc/nginx/real-ip.conf;

    limit_req_zone $binary_remote_addr zone=general:10m rate=100000r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=100000r/s;
    limit_conn_zone $binary_remote_addr zone=http_conn:10m;
    limit_req_status 429;
    limit_conn_status 429;

    client_max_body_size 1m;
    client_header_timeout 10s;
    client_body_timeout 30s;
    send_timeout 60s;

    upstream basil {
        server basil.basil-load.svc.cluster.local:8080;
        keepalive 256;
        keepalive_timeout 120s;
    }

    server {
        listen 8443 ssl default_server;
        http2 on;
        server_name basil.local *.basil.local;

        ssl_certificate /etc/nginx/certs/basil.local.crt;
        ssl_certificate_key /etc/nginx/certs/basil.local.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:20m;

        limit_req zone=general burst=100000 nodelay;
        limit_conn http_conn 60000;

        location /_files/Data/ {
            internal;
            alias /data/;
        }
        location /_files/Cache/ {
            internal;
            alias /cache/;
        }

        location = /v1/auth/login {
            limit_req zone=auth burst=100000 nodelay;
            include /etc/nginx/proxy.conf;
        }
        location = /users {
            limit_req zone=auth burst=100000 nodelay;
            include /etc/nginx/proxy.conf;
        }

        location ~ ^/v1/beatmapsets/?$ {
            client_max_body_size 100m;
            include /etc/nginx/proxy.conf;
        }
        location ~ ^/(v1/screenshots/?|web/osu-screenshot\.php)$ {
            client_max_body_size 10m;
            include /etc/nginx/proxy.conf;
        }
        location = /web/osu-submit-modular-selector.php {
            client_max_body_size 10m;
            include /etc/nginx/proxy.conf;
        }
        location ~ ^/v1/(users/\d+/avatar|menu/(banners|seasonals|icon))$ {
            client_max_body_size 5m;
            include /etc/nginx/proxy.conf;
        }

        location ~ ^/v1/(matches/\d+|diagnostics/.*|diagnostics|rooms/\d+/live|users/\d+/spectate)$ {
            proxy_buffering off;
            proxy_read_timeout 1h;
            include /etc/nginx/proxy.conf;
        }

        location / {
            include /etc/nginx/proxy.conf;
        }
    }
}

stream {
    limit_conn_zone $binary_remote_addr zone=irc_conn:10m;

    upstream basil_irc {
        server basil.basil-load.svc.cluster.local:6667;
    }

    server {
        listen 6697 ssl;
        ssl_certificate /etc/nginx/certs/basil.local.crt;
        ssl_certificate_key /etc/nginx/certs/basil.local.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        limit_conn irc_conn 60000;
        proxy_timeout 330s;
        proxy_connect_timeout 5s;
        proxy_protocol on;
        proxy_pass basil_irc;
    }
}
