name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --logger "console;verbosity=normal"

  deploy-docs:
    needs: build-and-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6

      - name: Restore
        run: dotnet restore

      # Building src/Basil.Web alone regenerates the 5 OpenAPI documents (Microsoft.Extensions.ApiDescription.Server)
      # into src/Basil.Web/obj/Basil.Web_{documentName}.json.
      - name: Build (generates OpenAPI documents)
        run: dotnet build src/Basil.Web --no-restore --configuration Release

      - name: Assemble static docs site
        run: |
          set -e
          SITE=site
          rm -rf "$SITE"
          # docs-site is served from /docs on a running instance, so nest it under docs/
          # and make the site root a redirect there.
          cp -r src/Basil.Web/docs-site "$SITE/docs"
          cp src/Basil.Web/obj/Basil.Web_basilapi.json "$SITE/docs/basil-api/basilapi.json"
          cat > "$SITE/index.html" <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
          	<meta charset="utf-8">
          	<meta http-equiv="refresh" content="0; url=docs/">
          	<title>Basil API Documentation</title>
          	<link rel="canonical" href="docs/">
          </head>
          <body>
          	<p><a href="docs/">Basil API Documentation</a></p>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
