name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # One project at a time: the projects share Docker and ports, so the solution is never passed to dotnet test.
      - name: Test
        shell: bash
        run: |
          status=0
          for project in $(find tests -name '*.Tests.csproj' -o -name '*ArchitectureTests.csproj' | sort); do
            dotnet test "$project" --no-build --configuration Release --logger "console;verbosity=minimal" || status=1
          done
          exit $status

  rest-contract:
    # Checks the HTTP contract of the REST API against a running server with the Postman collection in the repository
    # (status, envelope, public/token matrix, redirects, error statuses). It needs no Postman API key.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: basil
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ConnectionStrings__Write: Host=127.0.0.1;Port=5432;Username=postgres;Password=pw;Database=basil
      ConnectionStrings__Read: Host=127.0.0.1;Port=5432;Username=postgres;Password=pw;Database=basil
      Basil__Storage__Location: ${{ github.workspace }}/ci-data/Data
      Basil__Server__Domain: basil.local
      Basil__Server__Irc__Port: "0"
      Basil__Server__Multicast__Enabled: "false"
      Basil__Bot__Replies__Path: ${{ github.workspace }}/ci-data/replies.json
      Kestrel__Endpoints__Https__Url: http://127.0.0.1:5099

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6

      - name: Build the server
        run: dotnet build src/Hosts/Host --configuration Release

      - name: Create the administrator
        run: >-
          dotnet src/Hosts/Host/bin/Release/net10.0/Basil.Host.dll
          users create --username ciadmin --password ciadmin-pass --admin

      - name: Start the server
        run: |
          nohup dotnet src/Hosts/Host/bin/Release/net10.0/Basil.Host.dll > server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -H "Host: api.basil.local" http://127.0.0.1:5099/health && exit 0
            sleep 1
          done
          cat server.log
          exit 1

      # The server serves its own OpenAPI document; the published documentation is built from this copy, because
      # generating it at build time would start the application, which needs the database.
      - name: Save the OpenAPI document
        run: |
          mkdir -p openapi
          curl -sf -H "Host: api.basil.local" http://127.0.0.1:5099/openapi/v1.json -o openapi/v1.json
          curl -sf -H "Host: api.basil.local" http://127.0.0.1:5099/openapi/osu-stable.json -o openapi/osu-stable.json
          # The guides the bot and the IRC host write about themselves, as pages.
          for guide in bot irc; do
            curl -sf -H "Host: api.basil.local" "http://127.0.0.1:5099/guides/$guide" -o "openapi/$guide.html"
          done

      # The collection is built from the checked-in document, so the two must describe the document the server serves.
      - name: Check the REST contract artifacts are current
        run: |
          python3 -c "import json, sys; served = json.load(open('openapi/v1.json')); checked = json.load(open('tests/Hosts/Rest/postman/openapi.v1.json')); sys.exit('tests/Hosts/Rest/postman/openapi.v1.json is stale') if served != checked else None"
          (cd tests/Hosts/Rest/postman && python3 generate-collection.py)
          git diff --exit-code -- tests/Hosts/Rest/postman

      - name: Upload the OpenAPI document
        uses: actions/upload-artifact@v4
        with:
          name: openapi-documents
          path: openapi

      - name: Install the Postman CLI
        run: curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh

      - name: Run the contract collection
        run: >-
          postman collection run tests/Hosts/Rest/postman/basil-rest.postman_collection.json
          -e tests/Hosts/Rest/postman/basil-local.postman_environment.json --ignore-redirects

      - name: Server log
        if: failure()
        run: cat server.log

  deploy-docs:
    needs: [build-and-test, rest-contract]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7

      - name: Download OpenAPI documents
        uses: actions/download-artifact@v4
        with:
          name: openapi-documents
          path: openapi

      # Everything is generated by the running server (see the rest-contract job); nothing here is written by hand.
      - name: Assemble static docs site
        run: |
          set -e
          SITE=site
          mkdir -p "$SITE/docs"
          cp assets/icon.png "$SITE/docs/icon.png"
          scalar() { # directory, title, document
            mkdir -p "$SITE/docs/$1"
            cp "openapi/$3" "$SITE/docs/$1/$3"
            cat > "$SITE/docs/$1/index.html" <<EOF
          <!doctype html>
          <html lang="en">
          <head>
          	<meta charset="utf-8">
          	<meta content="width=device-width, initial-scale=1" name="viewport">
          	<link href="../icon.png" rel="icon" type="image/png">
          	<title>$2 | Basil Documentation</title>
          </head>
          <body>
          <div id="app"></div>
          <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
          <script>
          	Scalar.createApiReference('#app', {
          		sources: [{title: '$2', url: '$3'}],
          		hideTestRequestButton: true
          	})
          </script>
          </body>
          </html>
          EOF
          }
          scalar api "Basil API" v1.json
          scalar osu-stable "osu! (stable) client" osu-stable.json
          for guide in bot irc; do
            mkdir -p "$SITE/docs/$guide"
            # The guides name the host they were written on; a published page names no host.
            sed 's/basil\.local/your-domain/g' "openapi/$guide.html" > "$SITE/docs/$guide/index.html"
          done
          cat > "$SITE/docs/index.html" <<EOF
          <!doctype html>
          <html lang="en">
          <head>
          	<meta charset="utf-8">
          	<meta content="width=device-width, initial-scale=1" name="viewport">
          	<link href="icon.png" rel="icon" type="image/png">
          	<title>Basil Documentation</title>
          </head>
          <body>
          <h1>Basil Documentation</h1>
          <ul>
          	<li><a href="api/">HTTP API</a></li>
          	<li><a href="osu-stable/">osu! (stable) client endpoints</a></li>
          	<li><a href="bot/">BasilBot commands</a></li>
          	<li><a href="irc/">IRC</a></li>
          </ul>
          </body>
          </html>
          EOF
          cat > "$SITE/index.html" <<EOF
          <!doctype html>
          <html lang="en">
          <head>
          	<meta charset="utf-8">
          	<meta http-equiv="refresh" content="0; url=docs/">
          	<title>Basil Documentation</title>
          	<link rel="canonical" href="docs/">
          </head>
          <body/>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
