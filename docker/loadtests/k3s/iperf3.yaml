apiVersion: apps/v1
kind: Deployment
metadata:
  name: iperf3
  namespace: basil-load
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iperf3
  template:
    metadata:
      labels:
        app: iperf3
    spec:
      nodeSelector:
        kubernetes.io/hostname: mocha
      hostNetwork: true
      containers:
        - name: iperf3
          image: networkstatic/iperf3:latest
          args: ["-s"]
          ports:
            - containerPort: 5201
              hostPort: 5201
          resources:
            requests:
              cpu: "100m"
              memory: 64Mi
            limits:
              cpu: "500m"
              memory: 128Mi
