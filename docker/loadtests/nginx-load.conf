worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 8192;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # Distinguish osu! poll (has osu-token) from login (no osu-token) for server-side SLO reporting.
    map $http_osu_token $has_osu_token {
        default 1;
        ""      0;
    }

    log_format load '$time_iso8601\t$host\t$request_method\t$uri\t$status\t$request_time\t$upstream_response_time\t$has_osu_token';
    access_log /var/log/nginx/load.log load buffer=64k flush=2s;

    include /etc/nginx/real-ip.conf;

    # Per-address limits raised because every virtual user shares the generator node's IP.
    limit_req_zone $binary_remote_addr zone=general:10m rate=100000r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=100000r/s;
    limit_conn_zone $binary_remote_addr zone=http_conn:10m;
    limit_req_status 429;
    limit_conn_status 429;

    client_max_body_size 1m;
    client_header_timeout 10s;
    client_body_timeout 30s;
    send_timeout 60s;

    upstream basil {
        server basil.basil-load.svc.cluster.local:8080;
        keepalive 128;
        keepalive_timeout 120s;
    }

    server {
        # Port 8443 avoids Traefik's svclb on 443.
        listen 8443 ssl default_server;
        listen [::]:8443 ssl default_server;
        http2 on;
        server_name basil.local *.basil.local;

        ssl_certificate /etc/nginx/certs/basil.local.crt;
        ssl_certificate_key /etc/nginx/certs/basil.local.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header Strict-Transport-Security "max-age=31536000" always;

        limit_req zone=general burst=10000 nodelay;
        limit_conn http_conn 60000;

        location /_files/Data/ {
            internal;
            alias /data/;
        }
        location /_files/Cache/ {
            internal;
            alias /cache/;
        }

        location = /v1/auth/login {
            limit_req zone=auth burst=5000 nodelay;
            include /etc/nginx/proxy.conf;
        }
        location = /users {
            limit_req zone=auth burst=5000 nodelay;
            include /etc/nginx/proxy.conf;
        }

        location ~ ^/v1/beatmapsets/?$ {
            client_max_body_size 100m;
            include /etc/nginx/proxy.conf;
        }
        location ~ ^/(v1/screenshots/?|web/osu-screenshot\.php)$ {
            client_max_body_size 10m;
            include /etc/nginx/proxy.conf;
        }
        location = /web/osu-submit-modular-selector.php {
            client_max_body_size 10m;
            include /etc/nginx/proxy.conf;
        }
        location ~ ^/v1/(users/\d+/avatar|menu/(banners|seasonals|icon))$ {
            client_max_body_size 5m;
            include /etc/nginx/proxy.conf;
        }

        location ~ ^/v1/(matches/\d+|diagnostics(/.*)?|rooms/\d+/live|users/\d+/spectate)$ {
            proxy_buffering off;
            proxy_read_timeout 8h;
            include /etc/nginx/proxy.conf;
        }

        location / {
            include /etc/nginx/proxy.conf;
        }
    }
}

stream {
    limit_conn_zone $binary_remote_addr zone=irc_conn:10m;

    upstream basil_irc {
        server basil.basil-load.svc.cluster.local:6667;
    }

    server {
        listen 6697 ssl;
        listen [::]:6697 ssl;
        ssl_certificate /etc/nginx/certs/basil.local.crt;
        ssl_certificate_key /etc/nginx/certs/basil.local.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        limit_conn irc_conn 60000;
        proxy_timeout 330s;
        proxy_connect_timeout 5s;
        proxy_protocol on;
        proxy_pass basil_irc;
    }
}
