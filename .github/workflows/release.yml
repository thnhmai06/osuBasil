name: Release

on:
  release:
    types: [published]

jobs:
  package:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6

      - name: Restore
        run: dotnet restore

      - name: Publish win-x64
        run: >
          dotnet publish src/Basil.Web
          -c Release
          -r win-x64
          --self-contained true
          -o publish/win-x64

      - name: Publish linux-x64
        run: >
          dotnet publish src/Basil.Web
          -c Release
          -r linux-x64
          --self-contained true
          -o publish/linux-x64

      - name: Publish osx-arm64
        run: >
          dotnet publish src/Basil.Web
          -c Release
          -r osx-arm64
          --self-contained true
          -o publish/osx-arm64

      - name: Package executables
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          VERSION="${TAG#v}"
          mkdir -p dist

          for platform in win-x64 linux-x64 osx-arm64; do
            (
              cd "publish/$platform"
              zip -q -r "../../dist/Basil-$VERSION-$platform.zip" .
            )
          done

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            dist/Basil-*-win-x64.zip
            dist/Basil-*-linux-x64.zip
            dist/Basil-*-osx-arm64.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ github.token }}