name: Release

on:
  release:
    types: [ published ]

jobs:
  package:
    name: Build release

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            rid: win-x64
          - name: Windows ARM64
            os: windows-11-arm
            rid: win-arm64

          - name: Linux x64
            os: ubuntu-latest
            rid: linux-x64
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            rid: linux-arm64

          - name: MacOS x64
            os: macos-26-intel
            rid: osx-x64
          - name: MacOS ARM64
            os: macos-26
            rid: osx-arm64

    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6

      - name: Restore
        run: dotnet restore

      - name: Publish
        run: >
          dotnet publish src/Basil.Web
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -o publish/${{ matrix.rid }}
          -p:OpenApiGenerateDocumentsOnBuild=true

      - name: Package
        env:
          TAG: ${{ github.event.release.tag_name }}
          RID: ${{ matrix.rid }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $version = $env:TAG -replace '^v', ''
          $source = "publish/$env:RID"
          $destination = "dist/Basil-$version-$env:RID.zip"

          New-Item -ItemType Directory -Force -Path dist | Out-Null

          Compress-Archive `
            -Path "$source/*" `
            -DestinationPath $destination

      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/Basil-*.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

  docker:
    name: Build Docker image

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: thnhmai06/osubasil
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}