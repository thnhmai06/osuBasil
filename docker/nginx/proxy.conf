# What every location that forwards to Basil shares. Basil trusts only these headers, and only from this proxy.
proxy_pass http://basil;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-For "";
proxy_set_header CF-Connecting-IP "";
proxy_set_header CF-IPCountry $basil_country;
proxy_set_header X-Country-Code "";
