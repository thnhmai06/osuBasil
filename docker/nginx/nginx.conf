worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log off;

    include /etc/nginx/real-ip.conf;

    # Per-address protection lives here, not in Basil.
    limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=http_conn:10m;
    limit_req_status 429;
    limit_conn_status 429;

    client_max_body_size 1m;
    client_header_timeout 10s;
    client_body_timeout 30s;
    send_timeout 60s;

    # keepalive_timeout stays below Kestrel's 130 s so that nginx, not Basil, closes an idle connection first.
    upstream basil {
        server basil:8080;
        keepalive 32;
        keepalive_timeout 120s;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name basil.local *.basil.local;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        http2 on;
        server_name basil.local *.basil.local;

        # The default certificate covers basil.local and every subdomain. Mount your own over these two paths.
        ssl_certificate /etc/nginx/certs/basil.local.crt;
        ssl_certificate_key /etc/nginx/certs/basil.local.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header Strict-Transport-Security "max-age=31536000" always;

        limit_req zone=general burst=40 nodelay;
        limit_conn http_conn 50;

        # Stored files: Basil checks the right to read, then names a file here and nginx streams it with ranges.
        location /_files/ {
            internal;
            alias /data/;
        }

        # Sign-in and registration.
        location = /v1/auth/login {
            limit_req zone=auth burst=5 nodelay;
            include /etc/nginx/proxy.conf;
        }
        location = /users {
            limit_req zone=auth burst=5 nodelay;
            include /etc/nginx/proxy.conf;
        }

        # Uploads.
        location ~ ^/v1/beatmapsets/?$ {
            client_max_body_size 100m;
            include /etc/nginx/proxy.conf;
        }
        location ~ ^/(v1/screenshots/?|web/osu-screenshot\.php)$ {
            client_max_body_size 10m;
            include /etc/nginx/proxy.conf;
        }
        location = /web/osu-submit-modular-selector.php {
            client_max_body_size 10m;
            include /etc/nginx/proxy.conf;
        }
        location ~ ^/v1/(users/\d+/avatar|menu/(banners|seasonals|icon))$ {
            client_max_body_size 5m;
            include /etc/nginx/proxy.conf;
        }

        # Live streams (Server-Sent Events): no buffering, long reads.
        location ~ ^/v1/(matches/\d+|diagnostics/.*|rooms/\d+/live|users/\d+/spectate)$ {
            proxy_buffering off;
            proxy_read_timeout 1h;
            include /etc/nginx/proxy.conf;
        }

        location / {
            include /etc/nginx/proxy.conf;
        }
    }
}

# IRC: TLS ends here; Basil gets plain TCP behind a PROXY protocol header carrying the real client address.
stream {
    limit_conn_zone $binary_remote_addr zone=irc_conn:10m;

    upstream basil_irc {
        server basil:6667;
    }

    server {
        listen 6697 ssl;
        listen [::]:6697 ssl;
        ssl_certificate /etc/nginx/certs/basil.local.crt;
        ssl_certificate_key /etc/nginx/certs/basil.local.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        limit_conn irc_conn 20;
        # Above Basil's 300-second idle limit for IRC.
        proxy_timeout 330s;
        proxy_connect_timeout 5s;
        proxy_protocol on;
        proxy_pass basil_irc;
    }
}
